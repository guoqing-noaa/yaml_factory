         # Reject obs with qiWithoutForecast < 90. OR > 100.
         - filter: Bounds Check
           udescriptor: "bounds_check_qifn"
           filter variables:
           - name: windEastward
           - name: windNorthward
           test variables:
           - name: MetaData/qiWithoutForecast
           minvalue: 90.
           maxvalue: 100.
           where:
           - variable: ObsType/windEastward
             is_in: 245
           - variable: MetaData/satelliteIdentifier
             is_in: 272
           action:
             name: reject

