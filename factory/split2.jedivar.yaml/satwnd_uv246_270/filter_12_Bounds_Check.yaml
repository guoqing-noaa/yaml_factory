         # Reject obs with pct1 (Coeff. of Var.) outside of 0.04-0.5
         - filter: Bounds Check
           udescriptor: "bounds_check_pct1"
           filter variables:
           - name: windEastward
           - name: windNorthward
           test variables:
           - name: MetaData/coefficientOfVariation
           minvalue: 0.04
           maxvalue: 0.5
           where:
           - variable: ObsType/windEastward
             is_in: 246
           - variable: MetaData/satelliteIdentifier
             is_in: 270
           action:
             name: reject

