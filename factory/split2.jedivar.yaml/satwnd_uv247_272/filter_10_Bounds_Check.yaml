         # Bounds Check (ObsValue)
         - filter: Bounds Check
           udescriptor: "bounds_check_ObsValue"
           filter variables:
           - name: windEastward
           - name: windNorthward
           minvalue: -200
           maxvalue: 200
           where:
           - variable: ObsType/windEastward
             is_in: 247
           - variable: MetaData/satelliteIdentifier
             is_in: 272
           action:
             name: reduce obs space

