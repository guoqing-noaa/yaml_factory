         # Reject obs with pressure < 150 mb and > 300 mb
         - filter: Bounds Check
           udescriptor: "bounds_check_pressure"
           filter variables:
           - name: windEastward
           - name: windNorthward
           test variables:
           - name: MetaData/pressure
           minvalue: 15000.
           maxvalue: 30000.
           where:
           - variable: ObsType/windEastward
             is_in: 246
           - variable: MetaData/satelliteIdentifier
             is_in: 272
           action:
             name: reject

