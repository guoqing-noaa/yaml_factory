         # Time window filter
         - filter: Bounds Check
           udescriptor: "time_window_check"
           filter variables:
           - name: windEastward
           - name: windNorthward
           test variables:
           - name: MetaData/timeOffset
           minvalue: -5400
           maxvalue: 5400
           where:
           - variable: ObsType/windEastward
             is_in: 246
           - variable: MetaData/satelliteIdentifier
             is_in: 272
           action:
             name: reduce obs space

