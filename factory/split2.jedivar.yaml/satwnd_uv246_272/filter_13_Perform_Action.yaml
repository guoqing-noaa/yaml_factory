         # Low wind speed check
         - filter: Perform Action
           udescriptor: "reject_low_speed_amv"
           filter variables:
           - name: windEastward
           - name: windNorthward
           where:
           - variable: ObsFunction/Velocity
             maxvalue: 0.1
           - variable: ObsType/windEastward
             is_in: 246
           - variable: MetaData/satelliteIdentifier
             is_in: 272
           action:
             name: reject

